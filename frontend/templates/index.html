<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobs Search</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    <link href='https://fonts.googleapis.com/css?family=Roboto:400,500' rel='stylesheet'>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header id="main-header">
        <div class="header-content">
            <div class="logo">
                <a class="navbar-brand" href="/">
                    <i class="fas fa-briefcase"></i> 
                    NOVA Job Searcher</a>
            </div>
            <div class="secondary-search-container">
                <form id="search-form" action="{{ url_for('index_post') }}" method="get">
                    <div class="search-input-container">
                        <input type="text" id="secondary-search-input" name="search_term" placeholder="Search jobs..." value="{{ search_term if search_term else '' }}">
                        <button type="button" id="search-button" class="clear-btn">×</button>
                    </div>
                    <button type="submit" id="secondary-search-button">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>
                </form>
            </div>
        </div>
    </header>
    <div class="description-container">
        <div id="db-description" class="db-description"></div>
    </div>  

    <div class="search-info-container">
        <p id="search-info">Loading jobs...</p>
    </div>

    <div class="filter-container">
        <span class="filter-label">Level:</span>
        <label class="filter-chip"><input type="checkbox" class="job-level-filter" value="entry level"> Entry Level</label>
        <label class="filter-chip"><input type="checkbox" class="job-level-filter" value="mid-senior level"> Mid-Senior</label>
        <label class="filter-chip"><input type="checkbox" class="job-level-filter" value="associate"> Associate</label>
        <label class="filter-chip"><input type="checkbox" class="job-level-filter" value="director"> Director</label>
        <label class="filter-chip"><input type="checkbox" class="job-level-filter" value="executive"> Executive</label>
        <label class="filter-chip"><input type="checkbox" class="job-level-filter" value="internship"> Internship</label>
        <label class="filter-chip"><input type="checkbox" class="job-level-filter" value="not applicable"> N/A</label>
    </div>

    <main class="main-container">
        <section class="jobs-list-container">
            <div id="jobs-list"></div>
            <div id="loading-indicator" class="loading">Loading more jobs...</div>
        </section>

        <section id="job-detail-panel" class="job-detail-container">
            <div class="job-detail-content">
                <button id="close-detail" class="close-btn">×</button>
                <div id="job-detail"></div>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='scripts.js') }}"></script>
</body>
</html>
